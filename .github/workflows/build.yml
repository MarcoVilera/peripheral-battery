# Compila Peripheral Battery en GitHub Actions y, si SignPath esta configurado, firma
# el .exe y el instalador. Con un tag vX.Y.Z publica el release con el instalador.
#
#   - Ejecucion manual (Actions > Build > Run workflow): solo compila; el instalador
#     queda como artifact del run.
#   - git tag vX.Y.Z && git push origin vX.Y.Z: compila, firma y publica el release.
#
# La firma se activa sola al definir en el repo (Settings > Secrets and variables > Actions):
#   variable SIGNPATH_ORGANIZATION_ID  y  secret SIGNPATH_API_TOKEN
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # crear el release
  actions: read    # SignPath descarga los artifacts del run

env:
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG || 'peripheral-battery' }}
  # release-signing requiere aprobacion manual en SignPath; test-signing es para pruebas.
  SIGNPATH_POLICY: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($env:RELEASE -eq 'true' -and "v$v" -ne "${{ github.ref_name }}") {
            throw "El tag ${{ github.ref_name }} no coincide con VERSION = $v en version.py"
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Compilar ejecutable
        shell: pwsh
        run: .\build.ps1 -Stage App

      - name: Subir ejecutable sin firmar
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/PeripheralBattery

      - name: Firmar ejecutable (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          output-artifact-directory: dist/PeripheralBattery
          wait-for-completion-timeout-in-seconds: 3600  # da tiempo a aprobar a mano
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Compilar instalador
        shell: pwsh
        run: .\build.ps1 -Stage Installer

      - name: Subir instalador sin firmar
        id: upload-setup
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/PeripheralBattery-${{ steps.version.outputs.value }}-setup.exe

      - name: Firmar instalador (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          output-artifact-directory: dist/signed
          wait-for-completion-timeout-in-seconds: 3600
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Elegir instalador final
        id: final
        shell: pwsh
        run: |
          $name = "PeripheralBattery-${{ steps.version.outputs.value }}-setup.exe"
          $path = if ($env:SIGN -eq 'true') { "dist/signed/$name" } else { "dist/$name" }
          if (-not (Test-Path $path)) { throw "No se encontro $path" }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Subir instalador final
        uses: actions/upload-artifact@v4
        with:
          name: PeripheralBattery-${{ steps.version.outputs.value }}-setup
          path: ${{ steps.final.outputs.path }}

      - name: Publicar release
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ steps.final.outputs.path }}" --title "${{ github.ref_name }}" --generate-notes
